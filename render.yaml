services:
  - type: web
    name: hoppin-map-service
    runtime: python
    rootDir: map-service/backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: "*"
